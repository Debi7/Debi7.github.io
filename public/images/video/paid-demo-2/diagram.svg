<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="t">
  <title id="t">Схема: вопрос, маятник, ответ</title>
  <!-- Added 2026-09-28: the sample picture of the members-only block in paid-demo-2.md. A light card of its own, so it reads on the light and the dark page alike. -->
  <rect x="0" y="0" width="640" height="200" rx="16" fill="#fafaf9" stroke="#d6d3d1"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
  </defs>
  <g font-family="Georgia, serif" font-size="20" fill="#1c1917" text-anchor="middle">
    <rect x="30" y="70" width="150" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="105" y="107">Вопрос</text>
    <rect x="245" y="70" width="150" height="60" rx="10" fill="#fef3c7" stroke="#d97706"/>
    <text x="320" y="107">Маятник</text>
    <rect x="460" y="70" width="150" height="60" rx="10" fill="#dcfce7" stroke="#16a34a"/>
    <text x="535" y="107">Ответ</text>
  </g>
  <g stroke="#57534e" stroke-width="2.5" marker-end="url(#a)">
    <line x1="182" y1="100" x2="241" y2="100"/>
    <line x1="397" y1="100" x2="456" y2="100"/>
  </g>
  <text x="320" y="40" font-family="Georgia, serif" font-size="16" fill="#57534e" text-anchor="middle">Пример схемы к лекции</text>
</svg>
